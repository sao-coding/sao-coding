name: Update profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # sao-blog 發文後可以打這個事件立即更新：
  #   POST /repos/sao-coding/sao-coding/dispatches  {"event_type": "blog-updated"}
  repository_dispatch:
    types: [blog-updated]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 先產生 3D 日曆，dashboard 會從裡面取日曆圖層
      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate neofetch card, dashboard & blog posts
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 選填：放一個 PAT 進 secrets 才會算到私人 repo 的語言與 commit
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets profile-3d-contrib
          git diff --cached --quiet || (git commit -m "chore: update profile" && git push)

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f97316&color_dots=#ebedf0,#c6dbfb,#8fb6f6,#5a92f0,#3382ed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f97316&color_dots=#161b22,#0e3a6e,#1c5bb0,#2a75d9,#3382ed

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
